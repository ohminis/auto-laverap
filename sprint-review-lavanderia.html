            linkLabel: "Abrir Tablero Jira"
          }
        ],
        nextSteps: [
          { title: "Definición y división de verticales funcionales", subtitle: "Consolidar el desglose funcional integral para el flujo de lavandería." },
          { title: "Avanzar sobre los entregables de cada vertical", subtitle: "Especificar los artefactos técnicos requeridos para la siguiente iteración." }
        ],
        metric: "",
        blocker: ""
      }
    ];

    const slideTitles = [
      "01 · Portada y Squad",
      "02 · Iniciativas y Estado",
      "03 · Bloqueantes y Métricas",
      "04 · Próximos Pasos"
    ];

    let activeSprintIndex = 0;
    let activeSlideIndex = 0;
    let currentView = 'deck'; // 'deck' | 'doc'

    // Comments State
    let allComments = [];
    let commentsDrawerOpen = false;
    let commentsFilterMode = 'current'; // 'current' | 'all'
    let targetCommentSlideIndex = 0;

    const tabsEl = document.getElementById('tabs');
    const countEl = document.getElementById('review-count');
    const slideStageEl = document.getElementById('slide-stage');
    const dotsContainerEl = document.getElementById('dots-container');
    const progressEl = document.getElementById('deck-progress');
    const counterEl = document.getElementById('slide-counter');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const deckWrapper = document.getElementById('deck-wrapper');
    const overviewContainer = document.getElementById('overview-container');

    // Drawer elements
    const commentsDrawer = document.getElementById('comments-drawer');
    const commentsBackdrop = document.getElementById('comments-backdrop');
    const commentsFeed = document.getElementById('comments-feed');
    const drawerContextTitle = document.getElementById('drawer-context-title');
    const filterCurrentBtn = document.getElementById('filter-current-btn');
    const filterAllBtn = document.getElementById('filter-all-btn');
    const filterCurrentCount = document.getElementById('filter-current-count');
    const filterAllCount = document.getElementById('filter-all-count');
    const deckFeedbackBadge = document.getElementById('deck-feedback-badge');
    const topCommentBadge = document.getElementById('top-comment-badge');
    const authorSelect = document.getElementById('comment-author-select');
    const customAuthorInput = document.getElementById('comment-custom-author');
    const composerAvatar = document.getElementById('composer-avatar');
    const commentTextInput = document.getElementById('comment-text-input');

    // =========================================================================
    // ROUTING & VIEW MODES
    // =========================================================================
    function getInitialViewMode() {
      const pathname = window.location.pathname.toLowerCase();
      if (pathname.includes('/resumen') || pathname.includes('/doc')) return 'doc';
      if (pathname.includes('/diapositivas') || pathname.includes('/slides')) return 'deck';

      const params = new URLSearchParams(window.location.search);
      const viewParam = params.get('view') || params.get('vista') || params.get('modo');
      if (viewParam) {
        const val = viewParam.toLowerCase();
        if (val === 'doc' || val === 'resumen' || val === 'memo' || val === 'overview') return 'doc';
        if (val === 'deck' || val === 'diapositivas' || val === 'slides' || val === 'presentacion') return 'deck';
      }

      const hash = window.location.hash.toLowerCase().replace('#', '');
      if (hash === 'doc' || hash === 'resumen' || hash === 'overview') return 'doc';
      if (hash === 'deck' || hash === 'diapositivas' || hash === 'slides') return 'deck';

      return 'deck';
    }

    function syncUrl() {
      try {
        const url = new URL(window.location);
        url.searchParams.set('view', currentView === 'deck' ? 'diapositivas' : 'resumen');
        if (currentView === 'deck' && activeSlideIndex > 0) {
          url.searchParams.set('slide', activeSlideIndex + 1);
        } else {
          url.searchParams.delete('slide');
        }
        window.history.replaceState({}, '', url.toString());
      } catch (e) {}
    }

    function setViewMode(mode, shouldSyncUrl = true) {
      currentView = (mode === 'doc' || mode === 'resumen') ? 'doc' : 'deck';
      document.getElementById('view-deck-btn').classList.toggle('active', currentView === 'deck');
      document.getElementById('view-doc-btn').classList.toggle('active', currentView === 'doc');

      if (currentView === 'deck') {
        deckWrapper.style.display = 'block';
        overviewContainer.classList.remove('active');
        renderDeck();
      } else {
        deckWrapper.style.display = 'none';
        overviewContainer.classList.add('active');
        renderOverview();
      }

      if (shouldSyncUrl) {
        syncUrl();
      }
      updateCommentBadges();
    }

    // =========================================================================
    // RENDERING CORE
    // =========================================================================
    function renderTabs() {
      tabsEl.innerHTML = '';
      sprints.forEach((s, i) => {
        const btn = document.createElement('button');
        btn.className = 'tab' + (i === activeSprintIndex ? ' active' : '');
        btn.setAttribute('role', 'tab');
        btn.setAttribute('aria-selected', i === activeSprintIndex ? 'true' : 'false');
        
        btn.innerHTML = `
          <span>${s.tabLabel}</span>
          <span class="tab-badge">${s.sprintNumber || 'Sprint'}</span>
        `;

        btn.addEventListener('click', () => {
          activeSprintIndex = i;
          activeSlideIndex = 0;
          renderTabs();
          loadComments();
          if (currentView === 'deck') renderDeck();
          else renderOverview();
        });
        tabsEl.appendChild(btn);
      });

      countEl.textContent = `${sprints.length} ${sprints.length === 1 ? 'sprint review registrado' : 'sprint reviews registrados'}`;
    }

    function generateSlides(sprint) {
      // 1. Team cards
      const teamCards = sprint.team.map(m => `
        <div class="team-member-card">
          <div class="member-avatar">${m.initials || m.name.substring(0,2).toUpperCase()}</div>
          <div class="member-info">
            <span class="member-name">${m.name}</span>
            <span class="member-role">${m.role}</span>
          </div>
        </div>
      `).join('');

      // 2. Status cards
      const statusCards = sprint.status.map(s => {
        let iconSvg = '';
        if (s.state === 'ok') {
          iconSvg = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
        } else if (s.state === 'pending') {
          iconSvg = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`;
        } else {
          iconSvg = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`;
        }

        const linkMarkup = s.link ? `
          <div class="status-link-row">
            <a href="${s.link}" target="_blank" rel="noopener noreferrer" class="status-action-link" title="${s.linkLabel || 'Abrir recurso'}">
              <span>${s.linkLabel || 'Ver enlace'}</span>
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            </a>
          </div>
        ` : '';

        return `
          <div class="status-card">
            <div class="status-lead">
              <div class="status-icon-indicator ${s.state}">
                ${iconSvg}
              </div>
              <div class="status-text-group">
                <span class="status-text">${s.text}</span>
                ${linkMarkup}
              </div>
            </div>
            <span class="status-tag ${s.state}">${s.stateLabel}</span>
          </div>
        `;
      }).join('');

      // 3. Health & metrics
      const hasBlocker = sprint.blocker && sprint.blocker.trim().length > 0;
      const hasMetric = sprint.metric && sprint.metric.trim().length > 0;

      // 4. Next steps
      const stepsHtml = sprint.nextSteps.map((step, idx) => {
        const title = typeof step === 'string' ? step : step.title;
        const sub = typeof step === 'object' && step.subtitle ? step.subtitle : '';
        return `
          <div class="step-card">
            <div class="step-number">${String(idx + 1).padStart(2, '0')}</div>
            <div class="step-content">
              <span class="step-text">${title}</span>
              ${sub ? `<span class="step-subtext">${sub}</span>` : ''}
            </div>
          </div>
        `;
      }).join('');

      return [
        // Slide 1: Portada
        `
        <div class="slide-item" tabindex="-1">
          <div class="slide-eyebrow-row">
            <span class="slide-eyebrow">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              Sprint Review Semanal · ${sprint.sprintNumber || 'Actual'}
            </span>
            <span class="slide-badge-counter">01 / 04</span>
          </div>
          <div class="cover-content">
            <div class="cover-heading-group">
              <h2 class="cover-title">Solución Lavandería de Barrio</h2>
              <div class="cover-date-badge">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                <span>${sprint.dateLabel}</span>
              </div>
            </div>

            <div class="squad-section">
              <div class="squad-section-title">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span>Squad de Producto e Ingeniería</span>
              </div>
              <div class="team-grid">${teamCards}</div>
            </div>
          </div>
        </div>
        `,

        // Slide 2: Estado de iniciativas
        `
        <div class="slide-item" tabindex="-1">
          <div class="slide-eyebrow-row">
            <span class="slide-eyebrow">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
              Iniciativas y Estado
            </span>
            <span class="slide-badge-counter">02 / 04</span>
          </div>
          <div class="status-stack">
            ${statusCards}
          </div>
        </div>
        `,

        // Slide 3: Salud del sprint
        `
        <div class="slide-item" tabindex="-1">
          <div class="slide-eyebrow-row">
            <span class="slide-eyebrow">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
              Bloqueantes y métricas
            </span>
            <span class="slide-badge-counter">03 / 04</span>
          </div>
          <div class="health-grid">
            <div class="health-card ${hasBlocker ? 'alert-state' : 'clear-state'}">
              <div class="health-card-header">
                <span class="health-card-label">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
                  Bloqueantes
                </span>
                <span class="status-tag ${hasBlocker ? 'pending' : 'ok'}">${hasBlocker ? 'Con bloqueante' : 'Sin bloqueantes'}</span>
              </div>
              <div class="health-card-body">
                <p class="health-value ${hasBlocker ? '' : 'muted'}">${hasBlocker ? sprint.blocker : 'Sin bloqueantes'}</p>
              </div>
            </div>

            <div class="health-card">
              <div class="health-card-header">
                <span class="health-card-label">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
                  Métricas
                </span>
                <span class="status-tag open">${hasMetric ? 'Con métricas' : 'Sin métricas'}</span>
              </div>
              <div class="health-card-body">
                <p class="health-value ${hasMetric ? '' : 'muted'}">${hasMetric ? sprint.metric : 'Sin métricas'}</p>
              </div>
            </div>
          </div>
        </div>
        `,

        // Slide 4: Próximos pasos
        `
        <div class="slide-item" tabindex="-1">
          <div class="slide-eyebrow-row">
            <span class="slide-eyebrow">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 14 14"/></svg>
              Próximos Hitos & Compromisos
            </span>
            <span class="slide-badge-counter">04 / 04</span>
          </div>
          <div class="steps-timeline">
            ${stepsHtml}
          </div>
        </div>
        `
      ];
    }

    function renderDeck() {
      const sprint = sprints[activeSprintIndex];
      const slides = generateSlides(sprint);
      const totalSlides = slides.length;

      // Render Stage Content
      slideStageEl.innerHTML = slides.map((html, i) => {
        return html.replace('class="slide-item"', `class="slide-item${i === activeSlideIndex ? ' active' : ''}" data-index="${i}"`);
      }).join('');

      // Progress bar segments
      progressEl.innerHTML = slides.map((_, i) => `
        <div class="deck-progress-segment ${i <= activeSlideIndex ? 'completed' : ''}"></div>
      `).join('');

      // Dots Navigation
      dotsContainerEl.innerHTML = slides.map((_, i) => `
        <button class="dot-step ${i === activeSlideIndex ? 'active' : ''}" data-slide="${i}" aria-label="Ir a diapositiva ${i + 1}"></button>
      `).join('');

      dotsContainerEl.querySelectorAll('.dot-step').forEach(dot => {
        dot.addEventListener('click', () => {
          goToSlide(parseInt(dot.dataset.slide, 10));
        });
      });

      // Update Toolbar Controls
      counterEl.textContent = `${activeSlideIndex + 1} / ${totalSlides}`;
      prevBtn.disabled = activeSlideIndex === 0;
      nextBtn.disabled = activeSlideIndex === totalSlides - 1;

      targetCommentSlideIndex = activeSlideIndex;
      updateCommentBadges();
      if (commentsDrawerOpen) {
        renderCommentsFeed();
      }
    }

    function goToSlide(index) {
      const sprint = sprints[activeSprintIndex];
      const totalSlides = generateSlides(sprint).length;
      if (index < 0 || index >= totalSlides) return;

      activeSlideIndex = index;
      renderDeck();
      syncUrl();

      const activeEl = slideStageEl.querySelector('.slide-item.active');
      if (activeEl) {
        activeEl.focus();
      }
    }

    function renderOverview() {
      const sprint = sprints[activeSprintIndex];
      const slides = generateSlides(sprint);

      overviewContainer.innerHTML = `
        <div class="overview-section">
          <div class="overview-section-header">
            <div class="overview-section-title-group">
              <h3 class="overview-section-title">${sprint.dateLabel}</h3>
              <span class="project-tag">${sprint.sprintNumber || 'Sprint'}</span>
            </div>
            <button class="section-feedback-btn" onclick="openCommentsForSprint()" title="Ver feedback global">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              <span>Feedback Global</span>
            </button>
          </div>
          <div style="display: flex; flex-direction: column; gap: 32px;">
            ${slides.map((s, idx) => {
              const count = allComments.filter(c => c.sprintId === sprint.id && c.slideIndex === idx && !c.resolved).length;
              return `
                <div style="display: flex; flex-direction: column; gap: 10px; border-bottom: ${idx < slides.length - 1 ? '1px solid var(--border-inner)' : 'none'}; padding-bottom: ${idx < slides.length - 1 ? '24px' : '0'};">
                  <div style="display: flex; justify-content: flex-end;">
                    <button class="section-feedback-btn" onclick="openCommentsForSlide(${idx})" title="Comentar en esta sección">
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                      <span>${count > 0 ? `${count} ${count === 1 ? 'nota' : 'notas'}` : 'Comentar sección'}</span>
                    </button>
                  </div>
                  <div>${s.replace(/class="slide-item"/g, 'class="slide-item active"')}</div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
      updateCommentBadges();
    }

    // =========================================================================
    // COMMENTS LOGIC & CRUD
    // =========================================================================
    async function loadComments() {
      const currentSprintId = sprints[activeSprintIndex].id;
      try {
        const res = await fetch(`/api/comments?sprint=${encodeURIComponent(currentSprintId)}`);
        if (res.ok) {
          allComments = await res.json();
        } else {
          loadCommentsFromLocalStorage();
        }
      } catch (e) {
        // Standalone / Offline fallback
        loadCommentsFromLocalStorage();
      }
      updateCommentBadges();
      if (commentsDrawerOpen) {
        renderCommentsFeed();
      }
    }

    function loadCommentsFromLocalStorage() {
      try {
        const stored = localStorage.getItem('auto_laverap_comments');
        allComments = stored ? JSON.parse(stored) : [];
      } catch (e) {
        allComments = [];
      }
    }

    function saveCommentsToLocalStorage() {
      try {
        localStorage.setItem('auto_laverap_comments', JSON.stringify(allComments));
      } catch (e) {}
    }

    function updateCommentBadges() {
      const currentSprintId = sprints[activeSprintIndex].id;
      const sprintComments = allComments.filter(c => c.sprintId === currentSprintId && !c.resolved);
      const slideComments = sprintComments.filter(c => c.slideIndex === activeSlideIndex);

      topCommentBadge.textContent = sprintComments.length;
      deckFeedbackBadge.textContent = slideComments.length;
      filterCurrentCount.textContent = slideComments.length;
      filterAllCount.textContent = sprintComments.length;
    }

    function toggleComments(open) {
      commentsDrawerOpen = typeof open === 'boolean' ? open : !commentsDrawerOpen;
      commentsDrawer.classList.toggle('open', commentsDrawerOpen);
      commentsBackdrop.classList.toggle('open', commentsDrawerOpen);

      if (commentsDrawerOpen) {
        targetCommentSlideIndex = activeSlideIndex;
        renderCommentsFeed();
        setTimeout(() => commentTextInput.focus(), 150);
      }
    }

    function openCommentsForSlide(slideIdx) {
      targetCommentSlideIndex = slideIdx;
      activeSlideIndex = slideIdx;
      commentsFilterMode = 'current';
      filterCurrentBtn.classList.add('active');
      filterAllBtn.classList.remove('active');
      toggleComments(true);
    }

    function openCommentsForSprint() {
      commentsFilterMode = 'all';
      filterCurrentBtn.classList.remove('active');
      filterAllBtn.classList.add('active');
      toggleComments(true);
    }

    function setCommentFilter(mode) {
      commentsFilterMode = mode;
      filterCurrentBtn.classList.toggle('active', mode === 'current');
      filterAllBtn.classList.toggle('active', mode === 'all');
      renderCommentsFeed();
    }

    function renderCommentsFeed() {
      const currentSprintId = sprints[activeSprintIndex].id;
      const currentSlideTitle = slideTitles[targetCommentSlideIndex] || 'Diapositiva';
      
      drawerContextTitle.textContent = commentsFilterMode === 'current' 
        ? currentSlideTitle 
        : `Todo el ${sprints[activeSprintIndex].sprintNumber || 'Sprint'}`;

      let filtered = allComments.filter(c => c.sprintId === currentSprintId);
      if (commentsFilterMode === 'current') {
        filtered = filtered.filter(c => c.slideIndex === targetCommentSlideIndex);
      }

      updateCommentBadges();

      if (filtered.length === 0) {
        commentsFeed.innerHTML = `
          <div class="empty-comments-state">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <p>No hay feedback registrado en ${commentsFilterMode === 'current' ? 'esta diapositiva' : 'este sprint'}.</p>
          </div>
        `;
        return;
      }

      const tagLabels = {
        change: '🔧 Cambio',
        question: '❓ Pregunta',
        idea: '💡 Idea',
        general: '📝 Nota'
      };

      commentsFeed.innerHTML = filtered.map(c => {
        const initials = c.author ? c.author.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase() : '??';
        const dateFormatted = new Date(c.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const slideName = slideTitles[c.slideIndex] || `Slide ${c.slideIndex + 1}`;

        return `
          <div class="comment-card ${c.resolved ? 'resolved' : ''}" id="comment-${c.id}">
            <div class="comment-header">
              <div class="comment-author-group">
                <div class="comment-avatar">${initials}</div>
                <div class="comment-meta">
                  <span class="comment-author-name">${c.author}</span>
                  <span class="comment-author-role">${c.role || 'Squad Member'}</span>
                </div>
              </div>
              <div class="comment-badges-group">
                <span class="comment-tag-badge tag-${c.tag || 'general'}">${tagLabels[c.tag] || '📝 Nota'}</span>
              </div>
            </div>

            <p class="comment-body-text">${c.text.replace(/\n/g, '<br>')}</p>

            <div class="comment-footer">
              <div style="display: flex; align-items: center; gap: 6px;">
                <span class="comment-time">${dateFormatted}</span>
                ${commentsFilterMode === 'all' ? `<span class="comment-time">· ${slideName}</span>` : ''}
              </div>
              <div class="comment-actions">
                <button class="comment-btn-action" onclick="toggleResolveComment('${c.id}', ${!c.resolved})" title="${c.resolved ? 'Marcar como pendiente' : 'Marcar como resuelto'}">
                  ${c.resolved ? '↩ Reabrir' : '✓ Resolver'}
                </button>
                <button class="comment-btn-action delete" onclick="deleteComment('${c.id}')" title="Eliminar comentario">
                  🗑
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // =========================================================================
    // AUTHOR HANDLING & PERSISTENCE
    // =========================================================================
    function getStoredAuthor() {
      try {
        return JSON.parse(localStorage.getItem('auto_laverap_author')) || { name: 'Omar Pérez', role: 'PO Técnico' };
      } catch (e) {
        return { name: 'Omar Pérez', role: 'PO Técnico' };
      }
    }

    function saveStoredAuthor(name, role) {
      try {
        localStorage.setItem('auto_laverap_author', JSON.stringify({ name, role }));
      } catch (e) {}
    }

    function initAuthorSelector() {
      const saved = getStoredAuthor();
      const selectVal = `${saved.name}|${saved.role}`;
      let matched = false;

      for (let i = 0; i < authorSelect.options.length; i++) {
        if (authorSelect.options[i].value === selectVal) {
          authorSelect.selectedIndex = i;
          matched = true;
          break;
        }
      }

      if (!matched) {
        authorSelect.value = '__custom__';
        customAuthorInput.style.display = 'block';
        customAuthorInput.value = `${saved.name} (${saved.role})`;
      } else {
        customAuthorInput.style.display = 'none';
      }

      updateAvatarPreview(saved.name);
    }

    function onAuthorSelectChange(val) {
      if (val === '__custom__') {
        customAuthorInput.style.display = 'block';
        customAuthorInput.focus();
        updateAvatarPreview(customAuthorInput.value || 'Squad');
      } else {
        customAuthorInput.style.display = 'none';
        const [name, role] = val.split('|');
        saveStoredAuthor(name, role);
        updateAvatarPreview(name);
      }
    }

    function onCustomAuthorInput(val) {
      const name = val.split('(')[0].trim() || 'Squad';
      updateAvatarPreview(name);
      saveStoredAuthor(name, 'Squad Member');
    }

    function updateAvatarPreview(name) {
      const clean = (name || 'Squad').trim();
      const initials = clean.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase() || 'SQ';
      composerAvatar.textContent = initials;
    }

    // =========================================================================
    // SUBMIT & ACTIONS
    // =========================================================================
    async function handleCommentSubmit(e) {
      e.preventDefault();
      const text = commentTextInput.value.trim();
      if (!text) return;

      let author = '';
      let role = 'Squad Member';

      if (authorSelect.value === '__custom__') {
        const raw = customAuthorInput.value.trim();
        author = raw.split('(')[0].trim() || 'Anónimo';
        role = raw.includes('(') ? raw.split('(')[1].replace(')', '').trim() : 'Squad Member';
      } else {
        const parts = authorSelect.value.split('|');
        author = parts[0];
        role = parts[1] || 'PO Técnico';
      }

      const tagInput = document.querySelector('input[name="comment_tag"]:checked');
      const tag = tagInput ? tagInput.value : 'general';

      const commentData = {
        sprintId: sprints[activeSprintIndex].id,
        slideIndex: targetCommentSlideIndex,
        slideTitle: slideTitles[targetCommentSlideIndex] || 'Diapositiva',
        author,
        role,
        tag,
        text
      };

      try {
        const res = await fetch('/api/comments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(commentData)
        });

        if (res.ok) {
          const created = await res.json();
          allComments.unshift(created);
        } else {
          fallbackLocalAdd(commentData);
        }
      } catch (err) {
        fallbackLocalAdd(commentData);
      }

      commentTextInput.value = '';
      renderCommentsFeed();
      if (currentView === 'doc') {
        renderOverview();
      }
    }

    function fallbackLocalAdd(data) {
      const localItem = {
        ...data,
        id: 'c_local_' + Date.now(),
        createdAt: new Date().toISOString(),
        resolved: false
      };
      allComments.unshift(localItem);
      saveCommentsToLocalStorage();
    }

    async function toggleResolveComment(id, resolved) {
      try {
        const res = await fetch('/api/comments', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, resolved })
        });
        if (res.ok) {
          const index = allComments.findIndex(c => c.id === id);
          if (index !== -1) allComments[index].resolved = resolved;
        } else {
          fallbackLocalResolve(id, resolved);
        }
      } catch (e) {
        fallbackLocalResolve(id, resolved);
      }
      renderCommentsFeed();
      if (currentView === 'doc') renderOverview();
    }

    function fallbackLocalResolve(id, resolved) {
      const index = allComments.findIndex(c => c.id === id);
      if (index !== -1) {
        allComments[index].resolved = resolved;
        saveCommentsToLocalStorage();
      }
    }

    async function deleteComment(id) {
      if (!confirm('¿Deseas eliminar este comentario?')) return;
      try {
        const res = await fetch(`/api/comments?id=${encodeURIComponent(id)}`, {
          method: 'DELETE'
        });
        if (res.ok) {
          allComments = allComments.filter(c => c.id !== id);
        } else {
          allComments = allComments.filter(c => c.id !== id);
          saveCommentsToLocalStorage();
        }
      } catch (e) {
        allComments = allComments.filter(c => c.id !== id);
        saveCommentsToLocalStorage();
      }
      renderCommentsFeed();
      if (currentView === 'doc') renderOverview();
    }

    // =========================================================================
    // EVENT LISTENERS & GESTURES
    // =========================================================================
    prevBtn.addEventListener('click', () => goToSlide(activeSlideIndex - 1));
    nextBtn.addEventListener('click', () => goToSlide(activeSlideIndex + 1));

    document.addEventListener('keydown', (e) => {
      // Hotkey 'C' or 'c' to toggle feedback if not typing inside an input/textarea
      if ((e.key === 'c' || e.key === 'C') && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
        e.preventDefault();
        toggleComments();
        return;
      }

      // Esc to close comments
      if (e.key === 'Escape' && commentsDrawerOpen) {
        toggleComments(false);
        return;
      }

      // Ctrl + Enter to submit comment
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && document.activeElement === commentTextInput) {
        e.preventDefault();
        document.getElementById('comment-form').dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
        return;
      }

      if (currentView !== 'deck' || commentsDrawerOpen) return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown') {
        goToSlide(activeSlideIndex + 1);
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        goToSlide(activeSlideIndex - 1);
      }
    });

    // Touch Swipe Detection for mobile deck view with scroll guard
    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;

    deckWrapper.addEventListener('touchstart', (e) => {
      if (!e.changedTouches || e.changedTouches.length === 0) return;
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    deckWrapper.addEventListener('touchend', (e) => {
      if (!e.changedTouches || e.changedTouches.length === 0) return;
      touchEndX = e.changedTouches[0].screenX;
      touchEndY = e.changedTouches[0].screenY;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      if (currentView !== 'deck' || commentsDrawerOpen) return;
      const deltaX = touchEndX - touchStartX;
      const deltaY = touchEndY - touchStartY;
      
      if (Math.abs(deltaX) > 35 && Math.abs(deltaX) > Math.abs(deltaY) * 1.3) {
        if (deltaX < 0) {
          goToSlide(activeSlideIndex + 1);
        } else {
          goToSlide(activeSlideIndex - 1);
        }
      }
    }

    // Browser navigation (Back / Forward) support
    window.addEventListener('popstate', () => {
      const targetView = getInitialViewMode();
      const params = new URLSearchParams(window.location.search);
      const slideParam = parseInt(params.get('slide'), 10);
      if (!isNaN(slideParam) && slideParam >= 1 && slideParam <= 4) {
        activeSlideIndex = slideParam - 1;
      }
      setViewMode(targetView, false);
    });

    // Initial boot with URL parameter routing
    const initialParams = new URLSearchParams(window.location.search);
    const initialSlide = parseInt(initialParams.get('slide'), 10);
    if (!isNaN(initialSlide) && initialSlide >= 1 && initialSlide <= 4) {
      activeSlideIndex = initialSlide - 1;
    }

    currentView = getInitialViewMode();
    renderTabs();
    initAuthorSelector();
    loadComments();
    setViewMode(currentView, false);
  </script>
</body>
</html>
